name: CI
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Match the public repository's compatibility and current-toolchain gates.
  tests:
    name: Test Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go-version: '1.16.x' }
          - { os: ubuntu-latest, go-version: 'stable' }
          - { os: macos-latest, go-version: 'stable' }
          - { os: windows-latest, go-version: 'stable' }

    steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Print Go version
      run: go version

    - name: Vet
      run: go vet ./...

    - name: Run tests
      run: go test -race -timeout=10m ./...
