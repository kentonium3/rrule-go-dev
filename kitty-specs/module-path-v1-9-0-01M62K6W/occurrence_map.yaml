    action: do_not_change
    reason: Keep package name rrule and all exported declarations/signatures.
  import_paths:
    action: rename
    reason: Only active module/import declarations follow the new path; explicit history
      exceptions override.
  filesystem_paths:
    action: do_not_change
    reason: No repository directory or file moves.
  serialized_keys:
    action: do_not_change
    reason: No RRULE serialization, field keys or event schemas change.
  cli_commands:
    action: manual_review
    reason: Review module arguments in migration examples; do not rename commands
      or flags.
  user_facing_strings:
    action: manual_review
    reason: Mixed history, attribution and active installation URLs require per-occurrence
      decisions.
  tests_fixtures:
    action: manual_review
    reason: Update active imports only; preserve existing expectations, corpora and
      recorded outputs.
  logs_telemetry:
    action: do_not_change
    reason: No runtime logging or notification behavior is introduced.
