id: review-policy-tactic
name: Independent model review
purpose: Verify each work package through a model different from its 
  implementer.
schema_version: '1.0'
steps:
- description: Record the implementing model, reviewing model, and date. The 
    reviewing model must differ from the implementing model.
  title: Assign independent review
- description: Review root-cause correctness, preserved exported API and correct
    occurrences, and actual red/green and Go validation evidence.
  title: Inspect behavior and evidence
- description: Keep substantive review findings and resolution evidence. A 
    same-model review is degraded and cannot silently substitute for the 
    required independent review.
  title: Persist the verdict
