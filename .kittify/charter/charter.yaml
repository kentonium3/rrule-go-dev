governance:
  testing:
    tdd_required: true
    framework: go test
    type_checking: go vet
  quality:
    linting: gofmt -l .; go vet ./...
    pr_approvals: 1
    pre_commit_hooks: false
  commits:
    convention: conventional
  branch_strategy:
    main_branch: main
    rules:
    - Develop on scoped branches; merge to main only when Kent authorizes it.
    - Scoped staging; never force-push or git stash; never push upstream.
  charter:
    selected_paradigms: []
    selected_directives: []
    governance_references:
    - AGENTS.md
    - docs/CONTEXT.md
    authority_paths:
    - docs/issues/
directives:
  directives:
  - id: RRULE-001
    title: Compatibility and minimal fixes
    severity: error
    description: >-
      RFC 5545 is normative in all cases. Preserve exported types, functions,
      methods and signatures. Change behavior only where RFC 5545 requires it
      within the issue acceptance scope, or to prevent accepted input panics or
      hangs. Prove all other occurrences and String() output byte-identical to
      v1.8.3 plus inherited contributor fix76c646d with a golden comparison. No new dependencies. Prefer the smallest
      root-cause fix; state each finding's conditions and likelihood. Go 1.16
      remains the minimum. Any exported addition needs plan justification and
      a minor release. Record RFC corrections and behavior changes in the spec
      and release notes. Kent explicitly approved private ROption parse metadata
      and targetv1.9.0 on2026-10-25: signatures and keyed callers remain, but
      formerly valid external positional ROption literals break; disclose that
      exception and migration to keyed literals.
  - id: RRULE-002
    title: Test-first verification and independent review
    severity: error
    description: >-
      Regression tests must fail before the fix and pass after. Run go test ./...,
      go test -race ./..., go vet ./..., and gofmt -l .; fuzz BY* and INTERVAL
      domains for 60 seconds in the panic mission. Review each work package with a
      different model from its implementer and record both identities and date.
      Same-model review is degraded and does not silently satisfy this requirement.
  - id: RRULE-003
    title: Public development workspace and coordinated release
    severity: error
    description: >-
      The maintained library is kentonium3/rrule-go; it alone carries release
      tags, issues and contributions. This development repository
      kentonium3/rrule-go-dev is public (since 2026-11-17; private history is
      kept in a private archive) and holds Spec Kitty records and development
      docs only. Never push upstream. Any public posting, push to the public
      library repo, PR, tag or release requires Kent's sign-off on the exact
      copy. Never commit content from private systems or other private
      repositories here. Sending messages requires explicit authorization.
      Preserve MIT LICENSE and README modified-copy notice.
  - id: RRULE-004
    title: Scope and operational discipline
    severity: error
    description: >-
      Scope is public issues kentonium3/rrule-go#5 (DST) and #6 (floating
      UNTIL), as one mission with two work packages, one per issue. Issue7 is
      inherited contributor baseline at76c646d; do not assess or extend it. Follow docs/runbooks/teambition-backlog.md: specify, plan,
      independent post-plan review, tasks, analyze, implement/review, accept,
      consolidate and integrated final review. Apply the autonomous D-3 fault
      protocol: preserve evidence before mutation, diagnose, validate and record
      safe recovery; stop on unsafe failures or genuine scope decisions. Deliver
      a PR to main without merging it. The separate charter-update PR
      is authorized to merge first. No public actions or issue-closing keywords
      in commits. Use scoped Conventional Commits; never force-push or stash.
