  - id: TACTIC:acceptance-criteria-non-vacuity
    kind: tactic
    title: Acceptance Criteria Non-Vacuity
    summary: "Prove that each acceptance criterion, and the test that stands in for it, could actually fail. A criterion a no-op change would satisfy proves nothing about the delivered behavior; a refusal or absence probe that could not have seen the thing it asserts is missing proves nothing about the production path. This tactic is the single canonical definition of the delivery labels, the no-op-passable mark, and the three rules that keep acceptance criteria and their tests non-vacuous.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-acceptance-criteria-non-vacuity.md
  - id: TACTIC:acceptance-test-first
    kind: tactic
    title: Acceptance Test Driven Development (ATDD)
    summary: Anchor implementation work in externally observable behavior before internal coding begins.
    source_path: ''
    local_path: _LIBRARY/tactic-acceptance-test-first.md
  - id: TACTIC:mutation-testing-workflow
    kind: tactic
    title: Mutation Testing Workflow
    summary: "Verify that tests detect real bugs — not merely execute code. Mutation testing answers \"if I introduced a bug here, would my tests fail?\" where coverage only answers \"did my tests run this line?\".\n"
    source_path: ''
    local_path: _LIBRARY/tactic-mutation-testing-workflow.md
  - id: TACTIC:review-policy-tactic
